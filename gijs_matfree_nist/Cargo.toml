[package]
name = "rlce-test"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1"
indicatif = { version = "0.18.6", features = ["rayon"] }
nist-drbg-rs = { version = "0.1", features = ["aes-ctr"] }

[[bin]]
name = "rlce-test"
path = "src/main.rs"

[[bin]]
name = "rlce-attack"
path = "src/attack.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
